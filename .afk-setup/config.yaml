# How this stack is verified. Human-edited, committed, read-only to the runner.
# Everything commented out below is optional — uncomment a line to use it.

# The per-lane gate: every lane runs this, in parallel. `check:all` is nine
# commands behind one name, and the two cargo steps dominate it — `rust:clippy`
# and `rust:test` compile the whole crate, so at maxParallel 5 the machine ran
# five of them at once. That is the load spike that reads as a flaky baseline
# rather than as contention. The lane keeps everything that is cheap and
# per-diff; see baselineChecks below for the rest.
defaultChecks:
  - npm run typecheck
  - npm run lint
  - npm run ast:lint
  - npm run format:check
  - npm run rust:fmt:check
  - npm run test:run

# The post-merge set. A task that narrows no `checks` resolves them to
# `defaultChecks`, and `postMergeChecks` is `task.checks u baselineChecks`, so
# the union still runs `check:all` in full at every task's integration — no
# coverage is lost, it just stops running five times over. Kept as `check:all`
# rather than the two cargo lines so this list cannot drift from the script.
baselineChecks:
  - npm run check:all

# Most scripts here run through `infisical run`, so a lane may need env wiring
# linked or copied in before checks pass. Left empty until that is confirmed.
worktreeSetup:
  # src-tauri/target is deliberately NOT linked: a shared cargo target dir is
  # destroyed if any single lane runs `cargo clean`, which killed the runner
  # mid-integration on this epic's first attempt.
  link: [node_modules]
  copy: []
  run: []

maxParallel: 5

# Which top-level keys of a protected JSON file a lane may edit. The default
# below is applied when this key is absent; `package.json: []` reverts every
# edit, as the runner did before. A reverted package.json or lockfile blocks the
# lane, because its checks ran against a chain that file no longer describes.
# protectedEdits:
#   package.json: [scripts]

agent:
  timeoutMs: 2400000
  runtime: herdr
  # model: claude-opus-5
  # reasoningEffort: medium

# Skills each role gets. `always` is a rule the agent must apply; `offer` is a
# choice it applies only when the task needs it. `notes` is prose for a stack
# with no skill at all. Propose this block with `afk stack detect`; safe to
# hand-edit afterwards.
#
# vercel:nextjs is deliberately NOT offered — this app is Vite + Tauri, and that
# skill would only mislead. The Vercel skills here are for the Backend API under api/.
roles:
  implementer:
    always: [implement, karpathy-guidelines]
    offer: [vercel:vercel-functions, vercel:shadcn]
    notes: 'This project uses Supabase. Write every schema change as a migration file under supabase/migrations/. Do not change the database from the dashboard.'
  integrator:
    offer: [resolving-merge-conflicts]
  # plan-reviewer:
  #   always: []
  #   offer:  []
  verifier:
    offer: [diagnosing-bugs, vercel:react-best-practices]
  # supervisor:
  #   always: []
  #   offer:  []
